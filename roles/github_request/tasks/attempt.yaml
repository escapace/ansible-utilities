---
# Guard inside the included file: Ansible can queue all loop inclusions before
# executing them. Keep the last response intact when later attempts are skipped.
- name: github_request perform a github metadata attempt
  when: not _github_request_done
  block:
    - name: github_request request github metadata
      block:
        - name: github_request retrieve github metadata
          ansible.builtin.uri:
            url: '{{ github_request_url }}'
            use_netrc: false
            validate_certs: true
            timeout: 30
            status_code: 200
            return_content: '{{ github_request_return_content | default(false) }}'
          register: _github_request_attempt_result
          check_mode: false
      rescue:
        - name: github_request preserve the failed github response for classification
          ansible.builtin.set_fact:
            _github_request_attempt_result: '{{ ansible_failed_result }}'

    - name: github_request classify the github response
      ansible.builtin.set_fact:
        github_request_result: '{{ _github_request_attempt_result }}'
        _github_request_plan: >-
          {{ _github_request_attempt_result | escapace.utilities.github_metadata_retry(_github_request_policy, {
               'attempt': _github_request_attempt,
               'waited_seconds': _github_request_waited_seconds,
               'now_epoch': now(utc=true).timestamp(),
               'jitter_seconds': [0, 1] | random
             }) }}

    - name: github_request report a terminal github metadata failure
      ansible.builtin.fail:
        msg: >-
          GitHub request {{ github_request_url }} failed on attempt {{ _github_request_attempt }}:
          {{ _github_request_plan.reason }}.
          status={{ github_request_result.status | default('unavailable') }};
          retry_after={{ github_request_result.retry_after | default('absent') }};
          remaining={{ github_request_result.x_ratelimit_remaining | default('absent') }};
          reset={{ github_request_result.x_ratelimit_reset | default('absent') }}.
          {{ github_request_result.msg | default('') }}
          {{ (github_request_result.json | default({})).get('message', '')
             if github_request_result.json | default({}) is mapping else '' }}
      when: _github_request_plan.action == 'fail'

    - name: github_request wait before the next github metadata attempt on this host
      ansible.builtin.wait_for:
        timeout: '{{ _github_request_plan.delay_seconds }}'
      check_mode: false
      when: _github_request_plan.action == 'retry'

    - name: github_request record github metadata progress
      ansible.builtin.set_fact:
        _github_request_done: "{{ _github_request_plan.action == 'success' }}"
        _github_request_waited_seconds: >-
          {{ (_github_request_waited_seconds | int) + (_github_request_plan.delay_seconds | default(0)) }}
