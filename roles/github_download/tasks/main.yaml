---
- name: github_download validate inputs
  ansible.builtin.assert:
    that:
      - github_download_url is string
      - github_download_url is ansible.builtin.url
      - github_download_dest is string
      - github_download_dest.startswith('/')
      - github_download_checksum is string
      - github_download_checksum is match('^sha256:[0-9a-fA-F]{64}\\Z')
      - github_download_owner is string and github_download_owner | length > 0
      - github_download_group is string and github_download_group | length > 0
      - github_download_mode is string
      - github_download_mode is match('^0[0-7]{3}\\Z')
    fail_msg: >-
      github_download requires a URL string, an absolute file destination, a SHA-256
      checksum, owner and group strings, and a quoted four-digit octal mode.

- name: github_download validate the result variable name
  ansible.builtin.assert:
    that:
      - github_download_result_var is string
      - github_download_result_var is match('^[a-z][a-z0-9_]*_[a-z0-9_]+\\Z')
      - >-
        github_download_result_var is not match(
          '^(ansible|inventory|playbook|role|group|github_request|github_download|escapace_utilities)(_|\\Z)')
    fail_msg: >-
      github_download_result_var must be a lowercase caller-prefixed variable name,
      not an Ansible namespace, helper input, or collection-internal name.

- name: github_download validate the endpoint
  ansible.builtin.assert:
    that:
      - >-
        (github_download_url | ansible.builtin.urlsplit('scheme')) == 'https'
        or ((github_download_url | ansible.builtin.urlsplit('scheme')) == 'http'
            and (github_download_url | ansible.builtin.urlsplit('hostname')) in ['localhost', '127.0.0.1', '::1'])
      - (github_download_url | ansible.builtin.urlsplit('username')) is none
      - (github_download_url | ansible.builtin.urlsplit('password')) is none
    fail_msg: github_download_url must use HTTPS (or HTTP on loopback) without embedded credentials.

- name: github_download inspect the destination
  ansible.builtin.stat:
    path: '{{ github_download_dest }}'
    follow: false
  register: _escapace_utilities_github_download_destination

- name: github_download require a regular file destination or an absent path
  ansible.builtin.assert:
    that:
      - >-
        not _escapace_utilities_github_download_destination.stat.exists
        or _escapace_utilities_github_download_destination.stat.isreg | default(false)
    fail_msg: 'github_download_dest must be a regular file or absent: {{ github_download_dest }}.'

- name: github_download inspect the parent directory
  ansible.builtin.stat:
    path: '{{ github_download_dest | dirname }}'
  register: _escapace_utilities_github_download_parent

- name: github_download require an existing parent directory
  ansible.builtin.assert:
    that:
      - _escapace_utilities_github_download_parent.stat.isdir | default(false)
    fail_msg: 'github_download_dest parent directory must exist: {{ github_download_dest | dirname }}.'

- name: github_download load retry limits
  ansible.builtin.include_vars:
    file: '{{ role_path | dirname | dirname }}/vars/github_retry.yaml'
    name: _escapace_utilities_github_download_policy

- name: github_download initialize this invocation
  ansible.builtin.set_fact:
    _escapace_utilities_github_download_response: {}
    _escapace_utilities_github_download_done: false
    _escapace_utilities_github_download_waited_seconds: 0

- name: github_download make bounded download attempts
  ansible.builtin.include_tasks: attempt.yaml
  loop: '{{ range(1, _escapace_utilities_github_download_policy.max_attempts + 1) | list }}'
  loop_control:
    loop_var: _escapace_utilities_github_download_attempt

- name: github_download require a successful response before export
  ansible.builtin.assert:
    that:
      - _escapace_utilities_github_download_done
      - not _escapace_utilities_github_download_response.failed
    fail_msg: github_download completed without a successful response.

- name: github_download export the caller-owned result
  ansible.builtin.set_fact:
    '{{ github_download_result_var }}': '{{ _escapace_utilities_github_download_response }}'
