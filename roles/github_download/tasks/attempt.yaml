---
- name: github_download attempt artifact retrieval
  when: not _escapace_utilities_github_download_done
  block:
    - name: github_download download the artifact
      block:
        - name: github_download retrieve the verified artifact
          ansible.builtin.get_url:
            url: '{{ github_download_url }}'
            dest: '{{ github_download_dest }}'
            checksum: '{{ github_download_checksum | lower }}'
            use_netrc: false
            validate_certs: true
            timeout: 30
            mode: '{{ github_download_mode }}'
            owner: '{{ github_download_owner }}'
            group: '{{ github_download_group }}'
          register: _escapace_utilities_github_download_attempt_result
      rescue:
        - name: github_download preserve the failed result for classification
          ansible.builtin.set_fact:
            _escapace_utilities_github_download_attempt_result: '{{ ansible_failed_result }}'

    - name: github_download classify the download result
      ansible.builtin.set_fact:
        _escapace_utilities_github_download_response: '{{ _escapace_utilities_github_download_attempt_result }}'
        _escapace_utilities_github_download_plan: >-
          {{ _escapace_utilities_github_download_attempt_result | escapace.utilities.github_archive_retry(_escapace_utilities_github_download_policy, {
               'attempt': _escapace_utilities_github_download_attempt,
               'waited_seconds': _escapace_utilities_github_download_waited_seconds,
               'now_epoch': now(utc=true).timestamp(),
               'jitter_seconds': [0, 1] | random
             }) }}

    - name: github_download report a terminal download failure
      ansible.builtin.fail:
        msg: >-
          GitHub download {{ github_download_url }} to {{ github_download_dest }} failed on
          attempt {{ _escapace_utilities_github_download_attempt }}: {{ _escapace_utilities_github_download_plan.reason }}.
          status={{ _escapace_utilities_github_download_response.status_code | default('unavailable') }}.
          {{ _escapace_utilities_github_download_response.msg | default('') }} {{ _escapace_utilities_github_download_response.response | default('') }}
      when: _escapace_utilities_github_download_plan.action == 'fail'

    - name: github_download wait before the next attempt on this host
      ansible.builtin.wait_for:
        timeout: '{{ _escapace_utilities_github_download_plan.delay_seconds }}'
      check_mode: false
      when: _escapace_utilities_github_download_plan.action == 'retry'

    - name: github_download record download progress
      ansible.builtin.set_fact:
        _escapace_utilities_github_download_done: "{{ _escapace_utilities_github_download_plan.action == 'success' }}"
        _escapace_utilities_github_download_waited_seconds: >-
          {{ (_escapace_utilities_github_download_waited_seconds | int) + (_escapace_utilities_github_download_plan.delay_seconds | default(0)) }}
