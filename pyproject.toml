[project]
name = "ansible-utilities"
version = "0.0.0"
requires-python = ">=3.14,<3.15"

[dependency-groups]
dev = [
  "ansible-core==2.21.4",
  "ansible-lint==26.8.0; sys_platform == 'linux'",
  "black==26.10.1",
]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
managed = true

[tool.uv.workspace]
members = []

[tool.black]
target-version = ["py39"]

[tool.setuptools]
py-modules = []
